name: pr-review
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
jobs:
  copilot:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      requested: ${{ steps.request.outputs.requested }}
    steps:
      - name: Request a Copilot review
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api -X POST "repos/${{ github.repository }}/pulls/$PR/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]" --silent; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "Copilot review could not be requested; falling back to the Claude reviewer." >&2
          fi

  claude:
    needs: copilot
    if: needs.copilot.outputs.requested != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}.

            The diff is `git diff ${{ github.event.pull_request.base.sha }}...HEAD`. Read
            `.github/copilot-instructions.md` and `CLAUDE.md` first: they hold this
            repository's review rules, and most of them are not visible from the diff alone.

            Review the diff in this order:

            1. Logic and correctness: wrong conditions, unhandled errors, nil or index
               panics, goroutine and context misuse, off-by-one, behaviour that contradicts
               `docs/prd.md` or the design spec under `docs/superpowers/specs/`.
            2. Package layering: the import table in `.github/copilot-instructions.md` §2.
               An import crossing it is a defect even when it compiles.
            3. Placeholders only: flag any hostname, project key, plan key, build key, user
               name or URL that looks like a real corporate system, in code, tests, fixtures,
               golden files, test names and docs.
            4. Errors and exit codes: every non-`cli` package returns `*errs.Error`; only
               `cli.exitCode` maps kinds to exit codes.
            5. Secrets: values matching `password|secret|passphrase|sshkey`, values Bamboo
               returns as `********`, and `${ENV}`-resolved values must print as `********`
               everywhere, including `--json` and `--debug`. Trigger variables go in the form
               body, never the URL.
            6. Unit tests: new behaviour needs a test in the same change. Flag a changed
               branch with no covering case, a table test that gained a code path but no row,
               a test that sleeps or touches the network outside `e2e/`, and golden files
               regenerated without a deliberate renderer change.

            Do not comment on formatting or style: `gofmt`, `go vet` and `golangci-lint`
            already gate those in `ci.yml`. Do not comment on features `docs/prd.md` lists as
            out of scope or as a later version. No praise, no summary of what the PR does.

            Post each finding as an inline comment on the line it applies to, using
            `mcp__github_inline_comment__create_inline_comment`. State the problem and the
            fix in one or two sentences. If you find nothing, post a single comment saying so
            with `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
